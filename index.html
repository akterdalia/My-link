<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার লিংকসমূহ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00b4db, #0083b0);
      text-align: center;
      padding: 40px 20px;
      color: white;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }
    h2 {
      margin: 10px 0 5px;
    }
    p {
      font-size: 14px;
      margin-bottom: 25px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 12px 0;
      padding: 12px 18px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      transition: 0.3s;
    }
    .btn img {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      border-radius: 6px;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .facebook { background: #1877F2; }
    .coc { background: #FF9800; }
  </style>
</head>
<body>
  <div class="container">
    <!-- নাম -->
    <h2>মেহেদী হাসান</h2>
    <p>🌐 আমার প্রোফাইল লিংকসমূহ</p>

    <!-- বাটনসমূহ -->
    <a href="https://www.facebook.com/share/1MZtea44Pm/" class="btn facebook">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" alt="Facebook Logo">
      Facebook প্রোফাইল
    </a>

    <a href="https://link.clashofclans.com/en?action=OpenPlayerProfile&tag=QCYYYVULV" class="btn coc">
      <img src="https://seeklogo.com/images/C/clash-of-clans-logo-47B98A9A42-seeklogo.com.png" alt="CoC Logo">
      Clash of Clans প্রোফাইল
    </a>
  </div>
</body>
</html>
